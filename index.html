<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f6d3a0"><title>Rekenavonturen van Helena & Lorraine</title><style>
:root{font-family:ui-rounded,'Trebuchet MS',system-ui,sans-serif;color:#3b5260;background:#fff8ed}*{box-sizing:border-box}body{margin:0;background:linear-gradient(160deg,#fff5df,#e8f8f3);min-height:100vh}header{background:#fff9ed;padding:22px 16px;text-align:center;border-bottom:5px solid #f8d89a}h1{margin:0;font-size:clamp(25px,5vw,39px)}header p{margin:8px 0}.wrap{max-width:980px;margin:auto;padding:20px}button{font:inherit;cursor:pointer;border:0;touch-action:manipulation}button:focus-visible{outline:4px solid #2e9bb0;outline-offset:3px}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:15px}.pill{background:#fff;border:2px solid #e8dcc7;border-radius:20px;padding:10px 15px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.lesson{background:#fff;border:2px solid #f2dfb8;border-radius:22px;text-align:left;padding:15px;min-height:108px;box-shadow:0 4px 0 #ead9bc}.lesson.done{background:#e1f6df;border-color:#80bd83}.lesson b{display:block;margin:5px 0;font-size:17px}.lesson small{color:#697987}.emoji{font-size:27px}.panel{background:#fffdf8;border:3px solid #f0d6a8;border-radius:28px;padding:clamp(15px,4vw,32px);box-shadow:0 8px 0 #f2e0c6}.game{margin:18px 0;padding:22px 10px;background:#eff9f4;border-radius:22px;text-align:center;min-height:250px}.game h2{font-size:clamp(22px,4vw,30px)}.objects{display:flex;justify-content:center;flex-wrap:wrap;gap:10px;margin:20px auto;max-width:650px}.object{font-size:clamp(29px,6vw,48px);background:#fff;border-radius:17px;padding:7px}.choices{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}.choice{background:#fff;border:3px solid #e6d2a7;border-radius:18px;padding:14px 20px;font-size:clamp(24px,5vw,38px);min-width:75px;min-height:75px}.choice:active,.lesson:active{transform:scale(.97)}.primary{background:#ffce77;color:#394d59;border-radius:18px;padding:15px 23px;font-weight:800;min-height:52px}.secondary{background:#e9f2f9;c </style></head><body><header><h1>🌈 Rekenavonturen</h1><p>Voor Helena & Lorraine · Samen spelen en ontdekken</p></header><main class="wrap"><section id="home"><div class="toolbar"><div class="pill" id="progress">0 van 53 lessen gedaan</div><button class="pill" id="sound">🔔 Geluid aan</button></div><div class="bar"><span id="bar" style="width:0%"></span></div><p>Kies een les. Iedere les heeft vier korte spelletjes. Samen spelen mag!</p><div id="lessons" class="grid"></div></section><section id="play" class="hidden"><div class="toolbar"><button id="back" class="secondary">← Alle lessen</button><span id="step" class="pill"></span></div><div class="panel"><div id="heading"></div><div class="game" id="game"></div><div class="status" id="status" aria-live="polite"></div><div class="toolbar"><button id="prev" class="secondary">← Vorig spel</button><button id="retry" class="secondary">🔄 Nog eens</button><button id="next" class="primary">Volgend spel →</button><button id="finish" class="primary hidden">✓ Les afronden</button></div></div></section></main><footer>Met liefde gemaakt voor samen leren · Je voortgang blijft op dit apparaat bewaard.</footer><script>
const LESSONS=[{"id":1,"title":"Rekenen op het werk","theme":"Beroepen","date":"2026-10-26","icon":"🔧","limit":10},{"id":2,"title":"Samen opruimen","theme":"Helpen & delen","date":"2026-11-02","icon":"🧸","limit":10},{"id":3,"title":"Cadeautjes inpakken","theme":"Geven & verrassen","date":"2026-11-09","icon":"🎁","limit":10},{"id":4,"title":"De sterrenhemel","theme":"Sterren & licht","date":"2026-11-16","icon":"🌟","limit":10},{"id":5,"title":"Cadeautjes tellen","theme":"Op weg naar Sinterklaas","date":"2026-11-23","icon":"🎁","limit":10},{"id":6,"title":"Cadeautjes tellen","theme":"Sinterklaas","date":"2026-11-30","icon":"🎁","limit":10},{"id":7,"title":"Vier kaarsjes","theme":"Advent 3","date":"2026-12-07","icon":"🕯️","limit":10},{"id":8,"title":"Vier kaarsjes","theme":"Advent 4","date":"2026-12-14","icon":"🕯️","limit":10},{"id":9,"title":"Kerstballen tellen","theme":"Kerst","date":"2026-12-21","icon":"🎄","limit":10},{"id":10,"title":"De feestkalender","theme":"Nieuw jaar & dankbaarheid","date":"2026-12-28","icon":"📅","limit":10},{"id":11,"title":"Sneeuwvlokken zoeken","theme":"Winter & sneeuw","date":"2027-01-04","icon":"❄️","limit":10},{"id":12,"title":"Warme wanten","theme":"Warm en koud","date":"2027-01-11","icon":"🧤","limit":10},{"id":13,"title":"Winterdieren tellen","theme":"Winterdieren","date":"2027-01-18","icon":"🐧","limit":10},{"id":14,"title":"Het vormenfeest","theme":"Vormen & kleuren","date":"2027-01-25","icon":"🔷","limit":10},{"id":15,"title":"Ramen en deuren","theme":"Mijn huis","date":"2027-02-01","icon":"🏠","limit":10},{"id":16,"title":"Samen aan tafel","theme":"Familie","date":"2027-02-08","icon":"👨‍👩‍👧","limit":10},{"id":17,"title":"Hartjes uitdelen","theme":"Lief zijn voor elkaar","date":"2027-02-15","icon":"💗","limit":10},{"id":18,"title":"Vingers tellen","theme":"Mijn lichaam","date":"2027-02-22","icon":"✋","limit":10},{"id":19,"title":"Samen delen en tellen","theme":"Op weg naar Pasen","date":"2027-03-01","icon":"🤝","limit":10},{"id":20,"title":"  fruitsalade","theme":"Zomerfruit","date":"2027-07-26","icon":"🍓","limit":15},{"id":41,"title":"Groot en klein","theme":"Zon & schaduw","date":"2027-08-02","icon":"🌤️","limit":20},{"id":42,"title":"De picknickmand","theme":"Picknick","date":"2027-08-09","icon":"🧺","limit":20},{"id":43,"title":"Tractoren op het land","theme":"Landbouw","date":"2027-08-16","icon":"🚜","limit":20},{"id":44,"title":"Appels plukken","theme":"Oogst & appels","date":"2027-08-23","icon":"🍏","limit":20},{"id":45,"title":"Broodjes bakken","theme":"Graan & brood","date":"2027-08-30","icon":"🥖","limit":20},{"id":46,"title":"Het herfstbos","theme":"Herfst begint","date":"2027-09-06","icon":"🍂","limit":20},{"id":47,"title":"Bladeren sorteren","theme":"Herfstkleuren","date":"2027-09-13","icon":"🍁","limit":20},{"id":48,"title":"De voorraadkast","theme":"Noten & zaden","date":"2027-09-20","icon":"🌰","limit":20},{"id":49,"title":"Dieren in hun hol","theme":"Herfstdieren","date":"2027-09-27","icon":"🦊","limit":20},{"id":50,"title":"Plassen en druppels","theme":"Regen","date":"2027-10-04","icon":"💦","limit":20},{"id":51,"title":"Tel de sterren","theme":"Licht & donker","date":"2027-10-11","icon":"⭐","limit":20},{"id":52,"title":"Het kunstatelier","theme":"Kunst & creatief","date":"2027-10-18","icon":"🎨","limit":20},{"id":53,"title":"De blokkentoren","theme":"Bouwen","date":"2027-10-25","icon":"🧱","limit":20}];const LEGACY_KEY='helena-lorraine-rekenen-v1',KEY='helena-lorraine-rekenen-v2';
const LEGACY_THEMES=["Winter & sneeuw", "Warm en koud", "Winterdieren", "Vormen & kleuren", "Mijn huis", "Familie", "Lief zijn voor elkaar", "Mijn lichaam", "Muziek & ritme", "Verkeer & voertuigen", "Weer", "Eerste lente", "Nieuw leven", "Bloemen", "Insecten", "Boerderij", "Bomen & bos", "Nederland & Koningsdag", "Mem & familie", "Fruit", "Vlinders", "Dieren", "Water", "Zee & strand", "Zomer", "Zomerse smaken", "Reizen", "Spanje", "Strandvondsten", "Zomerfruit", "Zon & schaduw", "Picknick", "Landbouw", "Oogst & appels", "Graan & brood", "Herfst begint", "Herfstkleuren", "Noten & zaden", "Herfstdieren", "Regen", "Licht & donker", "Kunst & creatief", "Bouwen", "Beroepen", "Helpen & delen", "Geven & verrassen", "Sterren & licht", "Advent", "Kerst", "Dankbaarheid & nieuw jaar", "Herhalen & favorieten", "Vrij thema", "Rekenfeest"];
function readProgress(){try{const stored=localStorage.getItem(KEY);if(stored!==null){const a=JSON.parse(stored);return new Set(Array.isArray(a)?a.filter(i=>Number.isInteger(i)&&i>=0&&i<53):[])}const legacy=JSON.parse(localStorage.getItem(LEGACY_KEY)||'[]');const aliases={'Dankbaarheid & nieuw jaar':'Nieuw jaar & dankbaarheid','Nederland & Koningsdag':'Koningsdag & Nederland'};const migrated=new Set();if(Array.isArray(legacy))for(const i of legacy){if(!Number.isInteger(i)||!LEGACY_THEMES[i])continue;const theme=aliases[LEGACY_THEMES[i]]||LEGACY_THEMES[i];LESSONS.forEach((l,n)=>{if(l.theme===theme||(theme==='Advent'&&l.theme.startsWith('Advent')))migrated.add(n)})}localStorage.setItem(KEY,JSON.stringify([...migrated]));return migrated}catch(e){return new Set()}}
function saveProgress(){try{localStorage.setItem(KEY,JSON.stringify([...done]))}catch(e){$('status').textContent='Je browser kan de voortgang nu niet bewaren.'}}
let done=readProgress(),sound=localStorage.getItem(LEGACY_KEY+'-sound')!=='off',lesson=0,step=0,round=null,solved=false;const $=id=>document.getElementById(id),rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a,shuffle=a=>a.sort(()=>Math.random()-.5),obj=n=>Array.from({length:n},()=>'<span class="object">'+LESSONS[lesson].icon+'</span>').join(''),opts=(values,fn)=>'<div class="choices">'+values.map(v=>'<button class="choice" data-answer="'+v+'">'+v+'</button>').join('')+'</div>';function beep(ok){if(!sound)return;try{const C=window.AudioContext||window.webkitAudioContext,c=new C(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=ok?620:230;g.gain.setValueAtTime(.045,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.16);o.start();o.stop(c.currentTime+.17);setTimeout(()=>c.close(),350)}catch(e){}}function update(){ $('progress').textContent=done.size+' van 53 lessen gedaan';$('bar').style.width=(done.size/53*100)+'%';$('lessons').innerHTML=LESSONS.map((l,i)=>'<button class="lesson '+(done.has(i)?'done':'')+'" data-lesson="'+i+'"><span class="emoji">'+l.icon+'</span> <b>Les '+l.id+' · '+l.title+' '+(done.has(i)?'✓':'')+'</b><small>Weekthema: '+l.theme+'</small></button>').join('');$('lessons').querySelectorAll('[data-lesson]').forEach(b=>b.onclick=()=>openLesson(+b.dataset.lesson));$('sound').textContent=sound?'🔔 Geluid aan':'🔕 Geluid uit'}function openLesson(i){lesson=i;step=0;history.replaceState(null,'','?les='+(i+1));$('home').classList.add('hidden');$('play').classList.remove('hidden');render();window.scrollTo(0,0)}function max(){return LESSONS[lesson].limit}function setRound(){let cap=max(),a,b;switch(step){case 0:{let n=rnd(lesson<10?1:4,Math.min(cap,lesson<20?10:cap));round={n,correct:n,choices:shuffle([...new Set([n,Math.max(1,n-1),Math.min(cap,n+1),Math.max(1,n-2),Math.min(cap,n+2)])]).slice(0,4)};if(!round.choices.includes(n))round.choices[0]=n;break}case 1:{a=rnd(1,Math.max(2,cap-3));b=rnd(1,Math.max(2,cap-3));if(a===b)b=Math.min(cap,b+1);round={a,b,correct:a>b?'links':'rechts'};break}case 2:{a=rnd(1,Math.min(lesson<15?4:lesson<35?7:10,cap-1));b=rnd(1,Math.min(lesson<15?4:lesson<35?7:10,cap-a));round={a,b,correct:a+b,choices:shuffle([...new Set([a+b,Math.max(1,a+b-1),Math.min(cap,a+b+1),Math.max(1,a+b-2)])])};break}case 3:{a=rnd(1,cap-2);b=rnd(1,cap-a);round={a,b,correct:'meer'};break}}}function render(){solved=false;setRound();$('heading').innerHTML='<h2>Les '+(lesson+1)+' · '+LESSONS[lesson].title+'</h2><p>'+LESSONS[lesson].icon+' Weekthema: '+LESSONS[lesson].theme+' · Getallen tot '+max()+'</p>';$('step').textContent='Spel '+(step+1)+' van 4';$('prev').disabled=step===0;$('next').classList.remove('hidden');$('next').textContent='Volgend spel →';$('next').disabled=step===3;$('finish').classList.toggle('hidden',step!==3);$('finish').disabled=!solved;$('status').textContent='';$('status').className='status';let h='';if(step===0)h='<h2>🔎 Welk cijfer hoort hierbij?</h2><div class="objects">'+obj(round.n)+'</div>'+opts(round.choices);if(step===1)h='<h2>🧺 Waar zijn er meer?</h2><div class="pairs"><button class="basket" data-answer="links"><b>Links</b><div class="objects">'+obj(round.a)+'</div></button><button class="basket" data-answer="rechts"><b>Rechts</b><div class="objects">'+obj(round.b)+'</div></button></div>';if(step===2)h='<h2>➕ Hoeveel zijn het samen?</h2><div class="sum"><div class="objects">'+obj(round.a)+'</div><span>+</span><div class="objects">'+obj(round.b)+'</div><span>= ?</span></div>'+opts(round.choices);if(step===3)h='<h2>✨ Wat gebeurt er als we erbij doen?</h2><div class="objects">'+obj(round.a)+'</div><p>Er komen '+round.b+' bij. Zijn dat <b>meer</b> of <b>minder</b>?</p>'+opts(['meer','minder']);$('game').innerHTML=h;$('game').querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>answer(b.dataset.answer));}function answer(value){if(solved)return;let ok=String(value)===String(round.correct);beep(ok);$('status').textContent=ok?['🌟 Super gedaan!','🎉 Goed gekeken!','💛 Wat knap samen!'][rnd(0,2)]:'💛 Kijk nog eens goed en probeer opnieuw!';$('status').className='status '+(ok?'success':'error');if(ok){solved=true;$('finish').disabled=step!==3;$('game').querySelectorAll('button').forEach(b=>b.disabled=true);$('next').textContent='Volgend spel →'}}$('prev').onclick=()=>{if(step>0){step--;render();window.scrollTo(0,0)}};$('next').onclick=()=>{if(step<3){step++;render();window.scrollTo(0,0)}};$('finish').onclick=()=>{if(!solved)return;done.add(lesson);saveProgress();$('play').classList.add('hidden');$('home').classList.remove('hidden');update();window.scrollTo(0,0)};$('retry').onclick=render;$('back').onclick=()=>{$('play').classList.add('hidden');$('home').classList.remove('hidden');update()};$('sound').onclick=()=>{sound=!sound;localStorage.setItem(LEGACY_KEY+'-sound',sound?'on':'off');update()};update();const requestedLesson=Number(new URLSearchParams(location.search).get('les'));if(Number.isInteger(requestedLesson)&&requestedLesson>=1&&requestedLesson<=LESSONS.length)openLesson(requestedLesson-1);
</script></body></html>
